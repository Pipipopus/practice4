name: HelpDesk autotests
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Unit and integration tests
        run: npm test
      # Самостоятельное задание: добавить запуск Cypress E2E.
      # Сначала запустите тестовый сервер и дождитесь /api/health.
